name: CI

on:
  push:
    branches: ["**"]  # every branch, so fixes are checked before they reach main
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
        working-directory: .

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long!!
          DATABASE_URL: sqlite://
          REDIS_URL: redis://localhost:6379
          ADMIN_EMAILS: admin@test.com
          OPENAI_API_KEY: sk-test-dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_test_dummy
          SENDGRID_API_KEY: SG.test-dummy
          FROM_EMAIL: no-reply@test.com
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          DEBUG: "true"

  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      SECRET_KEY: ci-test-secret-key-at-least-32-chars-long!!

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build schema from scratch
        run: alembic upgrade head
        working-directory: backend

      - name: Models and migrations agree
        run: alembic check
        working-directory: backend

      - name: Downgrade and re-upgrade latest migration
        run: alembic downgrade -1 && alembic upgrade head
        working-directory: backend

  frontend:
    name: Frontend tests + lint + type-check + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.reviodigital.uk
